!
! Last configuration change at 22:18:07 UTC Mon Nov 23 2026
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname HQ
!
boot-start-marker
boot-end-marker
!
no aaa new-model
no ip icmp rate-limit unreachable
!
no ip domain lookup
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
!
ip tcp synwait-time 5
!
interface Tunnel1
 ip address 192.168.1.1 255.255.255.252
 ip ospf 2 area 0
 tunnel source Serial1/0
 tunnel destination 11.3.0.2
!
interface FastEthernet0/0
 ip address 192.168.50.1 255.255.255.0
 ip nat inside
 ip ospf 2 area 0
 duplex full
!
interface Serial1/0
 ip address 11.1.0.2 255.255.255.252
 ip nat outside
 serial restart-delay 0
!
interface Serial1/1
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/2
 ip address 11.0.0.2 255.255.255.252
 ip nat outside
 serial restart-delay 0
!
interface Serial1/3
 no ip address
 shutdown
 serial restart-delay 0
!
router ospf 2
!
ip nat inside source route-map ROUTE-TO-WAN1 interface Serial1/0 overload
ip nat inside source route-map ROUTE-TO-WAN2 interface Serial1/2 overload
ip forward-protocol nd
!
no ip http server
no ip http secure-server
ip route 0.0.0.0 0.0.0.0 Serial1/0
ip route 0.0.0.0 0.0.0.0 Serial1/2 2
!
access-list 1 permit 192.168.10.0 0.0.0.255
access-list 1 permit 192.168.20.0 0.0.0.255
access-list 1 permit 192.168.50.0 0.0.0.255
!
route-map ROUTE-TO-WAN2 permit 10
 match ip address 1
 match interface Serial1/2
!
route-map ROUTE-TO-WAN1 permit 10
 match ip address 1
 match interface Serial1/0
!
control-plane
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
end
